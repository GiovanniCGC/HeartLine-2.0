name: Publish Room208

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-room208.yml
      - Room208/payload.bin
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: room208-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build fetch-free Room208 page
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import gzip, re
          payload = Path('Room208/payload.bin')
          if not payload.exists():
              raise SystemExit('Room208/payload.bin is missing')
          html = gzip.decompress(payload.read_bytes()).decode('utf-8')
          if re.search(r'Pocket[- ]Terraformer|pocket[- ]terraformer', html):
              raise SystemExit('Old Pocket Terraformer name found')
          Path('Room208/index.html').write_text(html, encoding='utf-8')
          print('Wrote Room208/index.html:', len(html), 'chars')
          PY

      - name: Commit generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Room208/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Make Room208 fully standalone'
            git push origin main
          fi

      - name: Prepare Pages artifact
        run: |
          rm -rf /tmp/pages
          mkdir -p /tmp/pages
          cp -a . /tmp/pages/repo
          rm -rf /tmp/pages/repo/.git /tmp/pages/repo/.github
          touch /tmp/pages/repo/.nojekyll

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages/repo

      - id: deployment
        uses: actions/deploy-pages@v4
