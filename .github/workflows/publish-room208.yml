name: Publish Room 208

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Room208/LIVE_VERIFIED.txt'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Room 208 source
        run: |
          set -euo pipefail
          test -s Room208/index.html
          grep -qi '<title>ROOM 208</title>' Room208/index.html
          if grep -qiE 'Heartline 2\.0|Heartline|Pocket[ -]?Terraformer|Flipcraft' Room208/index.html; then
            echo 'Old project branding found in Room208/index.html' >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site/Room208
          cp Room208/index.html _site/index.html
          cp Room208/index.html _site/Room208/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Room 208 page
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 12); do
            if curl -fsSL --retry 2 --connect-timeout 10 "${PAGE_URL}?verify=${GITHUB_RUN_ID}-${i}" -o /tmp/live.html; then
              if [ "$(stat -c%s /tmp/live.html)" -gt 1200000 ] && grep -qi '<title>ROOM 208</title>' /tmp/live.html && ! grep -qiE 'Heartline 2\.0|Heartline|Pocket[ -]?Terraformer|Flipcraft|Room 208 failed to load:' /tmp/live.html; then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          test "$ok" -eq 1
      - name: Record successful live verification
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          {
            echo 'ROOM 208 live verified on GitHub Pages'
            echo "page_url=${PAGE_URL}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source_commit=${GITHUB_SHA}"
          } > Room208/LIVE_VERIFIED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Room208/LIVE_VERIFIED.txt
          git commit -m 'Record verified Room 208 deployment [skip ci]'
          git push
