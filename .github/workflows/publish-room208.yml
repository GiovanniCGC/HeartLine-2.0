name: Publish Room208

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-room208.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: room208-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified standalone build
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet gdown
          gdown --fuzzy 'https://drive.google.com/file/d/1fbgA2azjMq1GSLcqFGgYu_rdqG9AN2Jy/view' -O /tmp/Room208.html
          test $(stat -c%s /tmp/Room208.html) -gt 1200000
          grep -q '<title>ROOM 208</title>' /tmp/Room208.html
          if grep -qiE 'Pocket[- ]Terraformer|pocket[- ]terraformer' /tmp/Room208.html; then
            echo 'Old project name found' >&2
            exit 1
          fi

      - name: Install standalone build
        run: |
          mkdir -p Room208
          cp /tmp/Room208.html Room208/index.html
          rm -f Room208/payload.bin Room208/payload.gz Room208/index2.html Room208/final-index.html Room208/fix-note.txt Room208/asset-fix-marker.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Room208
          if ! git diff --cached --quiet; then
            git commit -m 'Install verified standalone Room208 build'
            git push origin main
          fi

      - name: Prepare Pages artifact
        run: |
          rm -rf /tmp/pages
          mkdir -p /tmp/pages/repo
          cp -a . /tmp/pages/repo/
          rm -rf /tmp/pages/repo/.git /tmp/pages/repo/.github
          touch /tmp/pages/repo/.nojekyll

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages/repo

      - id: deployment
        uses: actions/deploy-pages@v4
