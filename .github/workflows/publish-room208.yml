name: Publish Room208

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: room208-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Room208 archive
        run: |
          python -m pip install --quiet gdown
          gdown --fuzzy 'https://drive.google.com/file/d/1OU7Tcn-M3yUYl-G5R0SKuCyRBnbAjyad/view?usp=drive_link' -O /tmp/Room208.zip
          ls -lh /tmp/Room208.zip
          test $(stat -c%s /tmp/Room208.zip) -gt 900000000

      - name: Build standalone Room208 page
        run: |
          set -euo pipefail
          rm -rf /tmp/r208 /tmp/pages
          mkdir -p /tmp/r208 /tmp/pages/Room208
          unzip -q /tmp/Room208.zip -d /tmp/r208
          ROOT=/tmp/r208/Room208
          test -f "$ROOT/index.html"

          ROOT="$ROOT" python - <<'PY'
          from pathlib import Path
          import os, re
          root = Path(os.environ['ROOT'])
          s = (root/'index.html').read_text(encoding='utf-8')

          def link(m):
              href=m.group(1)
              rel=href.split('?',1)[0]
              p=root/rel
              if p.exists() and p.suffix.lower()=='.css':
                  return '<style>\n'+p.read_text(encoding='utf-8')+'\n</style>'
              if 'icon' in m.group(0).lower():
                  return ''
              return m.group(0)

          s=re.sub(r'<link[^>]+href="([^\"]+)"[^>]*>', link, s)

          def script(m):
              src=m.group(1)
              rel=src.split('?',1)[0]
              p=root/rel
              if not p.exists(): return m.group(0)
              js=p.read_text(encoding='utf-8')
              if rel.endswith('voice-assets.js'):
                  js += '\nwindow.R208=window.R208||{}; if(window.R208.VoiceAssets){window.R208.VoiceAssets.get=function(){return null;};}\n'
              return '<script>\n'+js+'\n</script>'

          s=re.sub(r'<script[^>]+src="([^\"]+)"[^>]*>\s*</script>', script, s)
          if re.search(r'Pocket[- ]Terraformer', s, re.I):
              raise SystemExit('Old Pocket Terraformer name found')
          if re.search(r'(?:src|href)="[^\"]+', s):
              raise SystemExit('External local asset reference remained')
          out=Path('/tmp/pages/Room208/index.html')
          out.write_text(s,encoding='utf-8')
          print('Standalone bytes:', out.stat().st_size)
          PY

          cp -a . /tmp/pages/repo
          rm -rf /tmp/pages/repo/.git /tmp/pages/repo/.github /tmp/pages/repo/Room208
          cp -a /tmp/pages/Room208 /tmp/pages/repo/Room208
          touch /tmp/pages/repo/.nojekyll

      - name: Commit standalone Room208 page
        run: |
          rm -rf Room208
          cp -a /tmp/pages/Room208 ./Room208
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Room208
          if ! git diff --cached --quiet; then
            git commit -m 'Add standalone Room208 game'
            git push origin main
          fi

      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/pages/repo

      - id: deployment
        uses: actions/deploy-pages@v4
